
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking | Velocity Motors</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="site-header" id="top">
        <nav class="navbar">
            <div class="nav-container">
                <img class="logo" src="./images/logo.webp" alt="Velocity Motors" width="200" height="200">
                <h2 class="brand-name">VELOCITY MOTORS</h2>

                <a class="nav-link" href="./index.html">HOME</a>
                <a class="nav-link" href="./cars.html">CARS</a>
                <a class="nav-link" href="./about.html">ABOUT</a>
                <a class="nav-link active" href="./booking.html">BOOKING</a>
                <a class="nav-link" href="./contact.html">CONTACT</a>
            </div>
        </nav>
    </header>

    <hr>

    <main id="main-content">

        <section class="booking-hero" id="booking-intro">
            <h2 class="section-title">BOOK YOUR TEST DRIVE</h2>
            <p class="hero-description">Experience the thrill of driving your dream car.</p>

            <figure class="booking-figure">
                <img class="booking-image" src="./images/test_drive.webp" alt="A car ready for a test drive">
            </figure>
        </section>

        <hr>

        <section class="booking-form-section" id="test-drive-form">
            <h2 class="section-title">TEST DRIVE BOOKING FORM</h2>

            <form class="booking-form" action="./php/booking.php" method="POST">

                <label class="form-label" for="name">Full Name:</label>
                <input
                    class="form-input"
                    type="text"
                    id="name"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >

                <br><br>

                <label class="form-label" for="email">Email ID:</label>
                <input
                    class="form-input"
                    type="email"
                    id="email"
                    name="emailid"
                    placeholder="abc@gmail.com"
                    required
                >

                <br><br>

                <label class="form-label" for="phone">Phone No.:</label>
                <input
                    class="form-input"
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="+XX XXXXX XXXXX"
                    required
                >

                <br><br>

                <fieldset class="gender-fieldset">
                    <legend>Gender:</legend>

                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </fieldset>

                <br>

                <label class="form-label" for="car">Select Car:</label>
                <select class="form-select" id="car" name="car" required>
                    <option value="">Select a car</option>
                    <option value="Lamborghini">Lamborghini</option>
                    <option value="Ferrari">Ferrari</option>
                    <option value="Porsche">Porsche</option>
                    <option value="Range Rover Sport">Range Rover Sport</option>
                </select>

                <br><br>

                <label class="form-label" for="date">Preferred Test Drive Date:</label>
                <input class="form-input" type="date" id="date" name="date" required>

                <br><br>

                <label class="form-label" for="message">Additional Message:</label>
                <br>
                <textarea
                    class="form-textarea"
                    id="message"
                    name="message"
                    rows="4"
                    cols="40"
                    placeholder="Any additional requirements..."
                ></textarea>

                <br><br>

                <button class="submit-button" type="submit">BOOK TEST DRIVE</button>

            </form>
        </section>

    </main>

    <hr>

    <footer class="site-footer" id="footer">
        <p>&copy; 2026 Velocity Motors. All rights reserved.</p>
    </footer>

</body>
</html>
