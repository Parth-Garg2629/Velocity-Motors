
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity Motors</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="site-header" id="top">
        <nav class="navbar">
            <div class="nav-container">
                <img class="logo" src="./images/logo.webp" alt="Velocity Motors" width="200px" height="200px">
                <h2 class="brand-name">VELOCITY MOTORS</h2>
                <a class="nav-link" href="./index.html">HOME</a>
                <a class="nav-link" href="./cars.html">CARS</a>
                <a class="nav-link" href="./about.html">ABOUT</a>
                <a class="nav-link" href="./booking.html">BOOKING</a>
                <a class="nav-link" href="./contact.html">CONTACT</a>
            </div>
        </nav>
    </header>

    <hr>
    
    <main id="main-content">

        <section class="hero" id="home-hero">
            <h1 class="hero-title">FIND YOUR PERFECT DRIVE</h1>
            <p class="hero-description">Discover premium cars that match your style.</p>
            <img class="hero-image" src="./images/showroom_img.webp" alt="Premium luxury car showroom interior featuring sports cars">
        </section>

        <hr>

        <section class="featured-cars" id="featured-cars">
            
            <h2 class="section-title">FEATURED CARS</h2>

            <div class="car-list">
                <figure class="car-card" id="lamborghini">
                    <img class="car-image" src="./images/lamborghini.webp" alt="Lamborghini"> 
                    <figcaption class="car-caption">
                        <p class="car-name">Lamborghini</p>
                        <p class="car-price">$385,000</p>
                    </figcaption>
                </figure>

                <figure class="car-card" id="ferrari">
                    <img class="car-image" src="./images/ferrari.webp" alt="Ferrari"> 
                    <figcaption class="car-caption">
                        <p class="car-name">Ferrari</p>
                        <p class="car-price">$350,000</p>
                    </figcaption>
                </figure>

                <figure class="car-card" id="porsche">
                    <img class="car-image" src="./images/porsche.webp" alt="Porsche"> 
                    <figcaption class="car-caption">
                        <p class="car-name">Porsche</p>
                        <p class="car-price">$360,000</p>
                    </figcaption>
                </figure>
            </div>

        </section>

        <hr>

        <section class="why-choose-us" id="why-choose-us">
            <h2 class="section-title">Why Choose Us?</h2>
            
            <ul class="benefit-list">
                <li>Quality</li>
                <li>Trust</li>
                <li>Premium Experience</li>
            </ul>

        </section>

    </main>
    
    <hr>

    <footer class="site-footer" id="footer">
        &copy; Velocity Motors
    </footer>

</body>
</html>
